services:
  trouvetonmarche-front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trouvetonmarche-front
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - nginx-network
      - trouvetonmarche-network
      - gcs-api-gateway-network

# Réseaux externes existants
networks:
  nginx-network:
    external: true
  trouvetonmarche-network:
    external: true
  gcs-api-gateway-network:
    external: true